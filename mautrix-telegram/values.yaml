replicaCount: 1

image:
  repository: dock.mau.dev/mautrix/telegram
  pullPolicy: IfNotPresent
  tag: "v0.15.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1337

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1337

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# ---------------------------------------------------------------------------
# Bridge configuration
# ---------------------------------------------------------------------------

homeserver:
  # Matrix homeserver URL (e.g. https://matrix.example.com)
  address: ""
  # The domain of the homeserver (for MXIDs, etc)
  domain: ""
  # The URL for client API requests, if different from the above
  # clientApiUrl: ""
  # The URL for server-server API requests, if different from the above
  # serverApiUrl: ""
  # Shared secret for the homeserver's admin API
  # adminApiSecret: ""
  # Rate limit for async media requests
  asyncMedia: 1

# Telegram bot/API credentials
# Get API ID/hash from https://my.telegram.org/apps
telegram:
  apiId: ""
  apiHash: ""
  # Bot token from @BotFather (optional but recommended)
  botToken: ""

# Appservice registration.yaml contents (generated by mautrix-telegram)
registration:
  # Static AS token for the bridge
  asToken: ""
  # Static HS token for the bridge
  hsToken: ""
  # ID of the appservice
  id: "telegram"
  # The localpart of the bridge bot user
  botUsername: "telegrambot"

# Bridge database configuration
database:
  # Type: sqlite3, postgres
  type: sqlite3
  # URI for the database
  # For sqlite3: /data/mautrix-telegram.db
  # For postgres: postgresql://user:password@host/database
  uri: /data/mautrix-telegram.db

# Logging level
logging:
  level: DEBUG
  # Output: file, stdout
  output: stdout

# Persistent volume for bridge state / database
persistence:
  enabled: true
  # existingClaim: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""

# Bridge config overrides (merged into config.yaml)
config:
  bridge:
    username_template: "telegram_{userid}"
    displayname_template: "{displayname} (Telegram)"
    private_chat_portal_meta: false
    delivery_receipts: false
    delivery_error_reports: false
    periodic_sync: true
    sync_interval: 10
    sync_create_limit: 30
    startup_sync: true
    sync_channel_members: true
    sync_matrix_state: true
    allow_matrix_login: true
    public_portals: false
    sync_with_custom_puppets: true
    double_puppet_server_map: {}
    double_puppet_allow_discovery: true
    login_shared_secret_map: {}
    invite_link_resolve: false
    allow_user_invite: true
    encryption:
      allow: false
      default: false
      require: false
      allow_key_sharing: false
      verification_levels:
        receive: unverified
        send: unverified
        share: cross-signed-tofu
      rotation:
        enable_custom: false
        milliseconds: 604800000
        messages: 100
    private_chat_name_templates:
      private: "{displayname}"
      group: "{title}"
    portal_message_buffer: 128
    backfill:
      invite_own_puppet: true
      initial_limit: 0
      missed_limit: 1000
      disable_notifications: false
    permissions:
      "*": relay
  appservice:
    id: telegram
    as_token: ""
    hs_token: ""
    bot_username: telegrambot
    bot_displayname: Telegram bridge bot
    ephemeral_events: true
    async_transactions: false
    # Note: port is automatically set to 8080 in container
    hostname: 0.0.0.0
    port: 8080
  telegram:
    device_info:
      device_model: mautrix-telegram
      system_version: Docker
      app_version: mautrix-telegram
      lang_code: en
    proxy:
      type: disabled
      address: ""
      port: 8080
      rdns: true
      username: ""
      password: ""
    connection:
      timeout: 120
      retries: 5
      retry_delay: 1
      flood_sleep_threshold: 60
      request_retries: 5
      connection_retries: -1
      retry_delay_min: 1
      retry_delay_max: 15
      max_concurrent_transmissions: 1000
